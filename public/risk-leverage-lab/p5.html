    const xstep = cand.find(s => (s / xMax) * iw >= 74) || 1;
    for (let f = 0; f <= xMax + 1e-9; f += xstep) {
      const x = X(f); if (x > w - pad.r + 1) break;
      ctx.fillText(f.toFixed(2), x, pad.t + ih + 6);
    }

    return { here, marks, best: bF, zero: zF, ruin: rF, xMax };
  }

  return { PAD, N, geometry, draw };
});
</script>

<script>
/* ---- src/readouts.js ---- */
/* =========================================================================
   RLL.Readouts — the words under each figure.

   Renderers return facts; this turns facts into the sentence the prototype
   printed, word for word. It sits between the figures and the shell so that
   (a) renderers stay DOM-free and copy-free, and (b) the copy has one home
   when scenes start needing their own wording.

   Emits HTML strings. Touches no DOM — the caller decides where they land.

   The copy here is verbatim from scene-p5-leverage-v2.html and is asserted
   character-for-character in check.js. It is deliberate teaching language:
   do not tidy it.
   ========================================================================= */
(function (root, factory) {
  const dep = (typeof module === "object" && module && module.exports)
    ? { Format: require("./format.js"), Engine: require("./engine.js"),
        Hist: require("./figures.hist.js") }
    : { Format: root.RLL.Format, Engine: root.RLL.Engine, Hist: root.RLL.Figures.hist };
  const api = factory(dep);
  if (typeof module === "object" && module && module.exports) module.exports = api;
  else (root.RLL = root.RLL || {}).Readouts = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function (dep) {
  "use strict";
  const { money, pct, sgn } = dep.Format;

  /* Count + average, never a wealth range (§7 drift list: P3 reported the
     range; count + average is the keeper). */
  function columnText(H, b) {
    const c = dep.Hist.columnAt(H, b);
    if (!c.n) return "empty";
    if (c.n === 1) return "1 manager " + money(c.only);
    return c.n.toLocaleString() + " managers avg. " + money(c.avg);
  }

  /* readout is what figures.hist.draw returned. `Figure 1` is hardcoded copy
     for now; it becomes scene config when figures get slots (§3). */
  function histStrip(readout, H, stats) {
    const { hoverBin, cursorV, selBin } = readout;
    if (hoverBin === null || hoverBin === undefined) {
      return (selBin === null || selBin === undefined)
        ? "hover to read percentiles · click a column to trace it in Figure 1"
        : "traced: <b>" + columnText(H, selBin) + "</b> · press Escape to clear";
    }
    const below = dep.Engine.shareBelow(stats.sorted, cursorV);
    return "cursor <b>" + money(cursorV) + "</b>" +
      " · <b>" + pct(below) + "</b> did worse" +
      " · <b>" + pct(1 - below) + "</b> did better" +
      " · this column <b>" + columnText(H, hoverBin) + "</b>";
  }

  /* Average dashed and gold, typical solid and ink — the same pairing as the
     lines themselves, so the legend needs no explaining. */
  function heroStrip(here) {
    return "<span style='color:var(--mean)'><i class='sw dash'></i>average per flip <b>" +
      sgn(here.arith) + "</b></span>" +
      "<span style='color:var(--ink)'><i class='sw' style='background:currentColor;height:3px'></i>typical per flip <b>" +
      sgn(here.geo) + "</b></span>";
  }

  return { columnText, histStrip, heroStrip };
});
</script>

<script>
/* ---- src/shell.js ---- */
/* =========================================================================
   RLL.Shell — the only module that touches the DOM.

   Builds a scene's markup from its config, owns the view state the engine
   deliberately knows nothing about (which flip is showing, log or linear,
   which column is traced, where the cursor is, the ghost), sizes the canvases,
   and drives the render loop.

     RLL.Shell.mount(hostElement, sceneConfig) -> { scene, destroy, render }

   Everything it draws comes from Engine + Figures; everything it says comes
   from Copy + Readouts. It contains no simulation and no wording of its own.
   ========================================================================= */
(function (root, factory) {
  const api = factory(root.RLL);
  (root.RLL = root.RLL || {}).Shell = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function (RLL) {
  "use strict";

  function mount(host, sceneConfig) {
    const { Engine, Scene, Theme, Format, Copy, Readouts, Figures } = RLL;
    const scene = Scene.create(sceneConfig);
    const copy = Copy.forScene(scene.id);
    const P = scene.params;
    const ns = id => scene.id + "-" + id;

    /* ------------------------------------------------------- view state */
    let tick = P.rounds, logScale = true, selBin = null, hoverX = null;
    let ghost = null, playing = false, playRAF = 0, raf = 0;
    let simResult = null, lastStats = null, lastHist = null;

    const sim = Engine.createSim();
    const theme = Theme.readFromCSS(document.documentElement);

    /* --------------------------------------------------------- markup */
    const el = (tag, attrs, ...kids) => {
      const n = document.createElement(tag);
      for (const k in (attrs || {})) {
        if (k === "class") n.className = attrs[k];
        else if (k === "html") n.innerHTML = attrs[k];
        else if (k === "text") n.textContent = attrs[k];
        else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
      }
      kids.flat().forEach(c => { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
      return n;
    };

    const FIG_MOD = { paths: Figures.paths, hist: Figures.hist, sensitivity: Figures.sensitivity };
    const figs = [];   // { def, mod, canvas, strip, num, readout }

    function buildFigure(def) {
      const canvas = el("canvas");
      const num = el("span", { class: "fignum" });
      const strip = el("div", { class: "strip" });
      const fig = el("figure", { "data-slot": def.slot },
        el("div", { class: "figtop" }, el("span", { class: "figtitle", text: def.title || "" }), num),
        el("div", { class: "canvasbox" }, canvas), strip);
      if (def.note) num.textContent = "";
      figs.push({ def, mod: FIG_MOD[def.type], canvas, strip, num, readout: null, geom: null });
      return fig;
    }

    /* The paths legend is static except for the ruin note, which only appears
       once anything has actually been wiped out. */
    function pathsLegend(strip) {
      const sw = (color, extra) => el("i", { class: "sw", style: extra || "background:currentColor" });
      strip.appendChild(el("span", { style: "color:var(--gain)" }, sw(), "above " + Format.stake(P.start)));
      strip.appendChild(el("span", { style: "color:var(--loss)" }, sw(), "below " + Format.stake(P.start)));
      strip.appendChild(el("span", { style: "color:var(--mean)" }, el("i", { class: "sw dash" }), "average"));
      strip.appendChild(el("span", { style: "color:var(--ink)" },
        sw(null, "background:currentColor;height:3px"), "median manager"));
      strip.appendChild(el("span", { "data-ruin": "" }));
    }

    const bySlot = s => scene.figures.filter(f => f.slot === s);
    const wide = bySlot("wide")[0] || null;

    const main = el("div", { class: "main", "data-layout": wide ? "duo-wide" : "duo" });
    if (wide && wide.collapsed) main.classList.add("collapsed");

    main.appendChild(el("header", { class: "head" },
      el("div", null,
        el("p", { class: "eyebrow", text: scene.eyebrow }),
        el("h1", { text: scene.title })),
      el("div", { class: "verdict" },
        ...Copy.VERDICT.map(v => el("div", { class: "cell" },
          el("span", { class: "k", text: v.label }),
          el("span", { class: "v " + v.cls, "data-verdict": v.key, text: "—" }))))));

    main.appendChild(el("div", { class: "duo" }, ...bySlot("a").concat(bySlot("b")).map(buildFigure)));

    let disclose = null, cue = null;
    if (scene.question) {
      cue = el("span", { class: "cue", text: wide && wide.collapsed ? "Show" : "Hide" });
      disclose = el("button", { class: "disclose", type: "button",
        "aria-expanded": String(!(wide && wide.collapsed)) }, el("span", { text: scene.question }), cue);
      main.appendChild(el("p", { class: "qband" }, disclose));
    }
    if (wide) main.appendChild(buildFigure(wide));
    const punch = el("p", { class: "punch" });
    main.appendChild(punch);

    figs.forEach(f => { if (f.def.type === "paths") pathsLegend(f.strip); });

    /* ------------------------------------------------------------- rail */
    const rail = el("aside", { class: "rail" });
    const statRows = {};
    if (scene.stats.length) {
      const dl = el("dl");
      scene.stats.forEach(k => {
        const dd = el("dd", { text: "—" });
        statRows[k] = dd;
        dl.appendChild(el("div", { class: "stat" }, el("dt", { text: Copy.STATS[k].label(P) }), dd));
      });
      rail.appendChild(el("fieldset", { class: "group" },
        el("legend", { text: "This run" }), dl, el("p", { class: "statnote", text: Copy.STAT_NOTE })));
    }

    const widgets = {};   // id -> { def, slider, box, hint, ... }
    const jumpBtns = {};
    let jumpsRow = null;

    function buildSlider(c) {
      const box = el("input", { class: "val", id: ns("l-" + c.id), type: "text",
        inputmode: c.dec ? "decimal" : "numeric", "aria-label": c.label });
      const wrapKids = [c.prefix || null, box, c.suffix || null];
      let ofSpan = null;
      if (c.id === "tick") { ofSpan = el("span", { text: String(P.rounds) }); wrapKids.push(" of ", ofSpan); }
      const slider = el("input", { type: "range", id: ns(c.id),
        min: typeof c.sliderMin === "function" ? c.sliderMin(P) : c.sliderMin,
        max: typeof c.sliderMax === "function" ? c.sliderMax(P) : c.sliderMax,
        step: c.step, value: readControl(c) });
      const hint = c.hint ? el("p", { class: "hint" }) : null;
      widgets[c.id] = { def: c, slider, box, hint, ofSpan };
      return [el("div", { class: "ctl" },
        el("label", { for: ns(c.id) }, c.label, el("span", { class: "valwrap" }, ...wrapKids)),
        slider), hint];
    }

    function readControl(c) { return c.param ? c.get(P) : tick; }
    function writeControl(c, v) { if (c.param) c.set(P, v); else { tick = Math.round(v); } }
    const ctlMax = c => Scene.controlMax(c, P);

    function buildGroup(name, ctls) {
      const kids = [];
      ctls.forEach(c => {
        if (c.kind === "slider") kids.push(...buildSlider(c));
        else if (c.kind === "toggle") { /* rendered with tick's row below */ }
      });
      /* Your bet carries the jump buttons when the scene reveals them. */
      if (name === "Your bet") {
        const sf = scene.figure("sensitivity");
        if (sf && (sf.revealUnlocks || []).indexOf("jumps") >= 0) {
          jumpsRow = el("div", { class: "row", "data-jumps": "" });
          [["best", "Best"], ["zero", "Zero"], ["one", "All in"], ["ruin", "Ruin"]].forEach(([k, label]) => {
            const b = el("b", { text: k === "one" ? "1.00" : "" });
            jumpBtns[k] = b;
            jumpsRow.appendChild(el("button", { class: "jump", type: "button", "data-jump": k }, label + " ", b));
          });
          kids.push(jumpsRow);
        }
      }
      if (name === "Compare") {
        widgets.ghostSet = el("button", { id: ns("ghost-set"), type: "button", text: "Set ghost" });
        widgets.ghostClear = el("button", { id: ns("ghost-clear"), type: "button", text: "Clear" });
        widgets.ghostNote = el("p", { class: "hint" });
        kids.push(el("div", { class: "row", style: "margin-top:0" }, widgets.ghostSet, widgets.ghostClear),
                  widgets.ghostNote);
      }
      if (name === "Run") {
        const has = id => ctls.some(c => c.id === id);
        if (has("tick") || has("scale")) {
          const row = el("div", { class: "row" });
          if (has("tick")) { widgets.play = el("button", { type: "button", text: "Play" }); row.appendChild(widgets.play); }
          if (has("scale")) {
            widgets.scaleLog = el("button", { type: "button", "aria-pressed": "true", text: "Log" });
            widgets.scaleLin = el("button", { type: "button", "aria-pressed": "false", text: "Linear" });
            row.appendChild(el("span", { class: "pill", role: "group", "aria-label": "Chart scale" },
              widgets.scaleLog, widgets.scaleLin));
          }
          kids.push(row);
        }
        if (has("seed")) {
          widgets.seed = el("input", { type: "number", value: String(P.seed), min: "1", step: "1",
            "aria-label": "Random seed" });
          widgets.reroll = el("button", { type: "button", text: "Reroll" });
          widgets.reset = el("button", { type: "button", text: "Reset" });
          kids.push(el("div", { class: "row" }, widgets.seed, widgets.reroll, widgets.reset));
        }
      }
      if (!kids.length) return null;
      const fs = el("fieldset", { class: "group" + (name === "Your bet" ? " star" : "") },
        el("legend", { text: name }), ...kids);
      return fs;
    }

    Scene.GROUP_ORDER.forEach(name => {
      const ctls = scene.controls.filter(c => c.group === name);
      if (!ctls.length) return;
      const g = buildGroup(name, ctls);
      if (g) rail.appendChild(g);
    });

    const app = el("div", { class: "app" }, main, rail);
    host.innerHTML = "";
    host.appendChild(app);
    document.body.classList.toggle("revealed", scene.revealAnswers);

    /* ------------------------------------------------------- rendering */
    function fitCanvas(cv) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2), r = cv.getBoundingClientRect();
      cv.width = Math.max(1, Math.round(r.width * dpr));
      cv.height = Math.max(1, Math.round(r.height * dpr));
      const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, w: r.width, h: r.height };
    }

    function render(recompute) {
      if (recompute) { simResult = sim.run(P, scene.switches); selBin = null; }
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const st = Engine.statsAt(simResult, P, tick);
        const H = Engine.histogram(st, P, { logScale });
        lastStats = st; lastHist = H;
        const data = { sim: simResult, stats: st, hist: H };
        const cfg = { params: P, theme, logScale, tick, selBin, hoverX,
                      selRange: Engine.selectedRange(H, selBin), ghost };
        figs.forEach(f => {
          const { ctx, w, h } = fitCanvas(f.canvas);
          f.geom = f.mod.geometry(w, h);
          f.readout = f.mod.draw(ctx, f.geom, data, cfg);
        });
        narrate(st, H);
      });
    }

    function narrate(st, H) {
      const rt = Engine.rates(P, P.f);
      main.querySelectorAll("[data-verdict]").forEach(n =>
        n.innerHTML = Copy.VERDICT.find(v => v.key === n.getAttribute("data-verdict")).value(st, rt, P));

      scene.controls.forEach(c => {
        const wgt = widgets[c.id];
        if (wgt && wgt.hint && c.hint) wgt.hint.textContent = c.hint(P);
      });
      if (widgets.ghostNote) widgets.ghostNote.innerHTML = Copy.ghostNote(ghost, P);

      figs.forEach(f => {
        if (f.def.type === "paths") {
          f.num.textContent = copy.figNum(P, f.readout);
          const rn = f.strip.querySelector("[data-ruin]");
          if (rn) rn.innerHTML = Copy.ruinNote(st);
        } else if (f.def.type === "hist") {
          f.num.textContent = "Figure 2" + (f.def.note ? " · " + f.def.note : "");
          f.strip.innerHTML = f.readout.tooSmall ? "" : Readouts.histStrip(f.readout, H, st);
        } else if (f.def.type === "sensitivity") {
          f.num.textContent = "Figure 3" + (f.def.note ? " · " + f.def.note : "");
          f.strip.innerHTML = f.readout.tooSmall ? "" : Readouts.heroStrip(f.readout.here);
        }
      });

      const bF = Engine.bestF(P), zF = Engine.zeroF(P), rF = Engine.ruinF(P);
      punch.innerHTML = copy.punchline(P, st, rt, { best: bF, zero: zF, ruin: rF });

      scene.stats.forEach(k => { statRows[k].textContent = Copy.STATS[k].value(st, rt); });

      if (jumpBtns.best) jumpBtns.best.textContent = bF.geo > 0 ? bF.f.toFixed(2) : "—";
      if (jumpBtns.zero) jumpBtns.zero.textContent = zF ? zF.toFixed(2) : "—";
      if (jumpBtns.ruin) jumpBtns.ruin.textContent = isFinite(rF) ? rF.toFixed(2) : "—";
    }

    function syncLabels() {
      scene.controls.forEach(c => {
        const wgt = widgets[c.id];
        if (!wgt || !wgt.slider) return;
        const v = readControl(c);
        if (document.activeElement !== wgt.box) {
          wgt.box.value = c.dec ? v.toFixed(c.dec) : v;
          wgt.box.classList.remove("bad");
        }
        wgt.slider.max = ctlMax(c);
        wgt.slider.value = v;
      });
      if (widgets.tick && widgets.tick.ofSpan) widgets.tick.ofSpan.textContent = String(P.rounds);
      if (widgets.seed) widgets.seed.value = String(P.seed);
    }

    /* ---------------------------------------------------------- events */
    const off = [];
    const on = (t, ev, fn) => { t.addEventListener(ev, fn); off.push(() => t.removeEventListener(ev, fn)); };

    scene.controls.forEach(c => {
      const wgt = widgets[c.id];
      if (!wgt || !wgt.slider) return;
      on(wgt.slider, "input", () => { writeControl(c, +wgt.slider.value); clampTick(); syncLabels(); render(c.recompute); });
      const commit = () => {
        const v = parseFloat(String(wgt.box.value).replace(/[,\s%×x]/g, ""));
        if (!isFinite(v) || v < c.min || v > ctlMax(c)) { wgt.box.classList.add("bad"); return false; }
        writeControl(c, v); clampTick(); syncLabels(); render(c.recompute); return true;
      };
      on(wgt.box, "keydown", e => { if (e.key === "Enter") { e.preventDefault(); if (commit()) wgt.box.blur(); } });
      on(wgt.box, "input", () => wgt.box.classList.remove("bad"));
      on(wgt.box, "blur", () => {
        const v = readControl(c);
        wgt.box.value = c.dec ? v.toFixed(c.dec) : v; wgt.box.classList.remove("bad");
      });
    });
    function clampTick() { if (tick > P.rounds) tick = P.rounds; }

    if (jumpsRow) {
      jumpsRow.querySelectorAll("[data-jump]").forEach(b => on(b, "click", () => {
        const k = b.getAttribute("data-jump");
        let v = 1;
        if (k === "best") v = Engine.bestF(P).f;
        else if (k === "zero") { const z = Engine.zeroF(P); if (!z) return; v = z; }
        else if (k === "ruin") { const r = Engine.ruinF(P); if (!isFinite(r)) return; v = Math.min(3, r); }
        P.f = Math.min(3, Math.max(0, +v.toFixed(2)));
        syncLabels(); render(true);
      }));
    }

    if (disclose) on(disclose, "click", () => {
      const open = main.classList.toggle("collapsed") === false;
      document.body.classList.toggle("revealed", open || scene.revealAnswers);
      disclose.setAttribute("aria-expanded", String(open));
      cue.textContent = open ? "Hide" : "Show";
      render(false);
    });

    function setScale(isLog, redraw) {
      logScale = isLog;
      if (widgets.scaleLog) widgets.scaleLog.setAttribute("aria-pressed", String(isLog));
      if (widgets.scaleLin) widgets.scaleLin.setAttribute("aria-pressed", String(!isLog));
      if (redraw) { selBin = null; render(false); }
    }
    if (widgets.scaleLog) on(widgets.scaleLog, "click", () => setScale(true, true));
    if (widgets.scaleLin) on(widgets.scaleLin, "click", () => setScale(false, true));

    if (widgets.seed) {
      on(widgets.seed, "change", e => { P.seed = Math.max(1, Math.floor(+e.target.value) || 1); render(true); });
      on(widgets.reroll, "click", () => {
        P.seed = 1 + Math.floor(Math.random() * 99999);
        widgets.seed.value = String(P.seed); render(true);
      });
      on(widgets.reset, "click", () => {
        scene.reset(); tick = P.rounds; selBin = null; ghost = null;
        document.body.classList.toggle("revealed", scene.revealAnswers);
        if (wide && wide.collapsed) {
          main.classList.add("collapsed");
          if (disclose) { disclose.setAttribute("aria-expanded", "false"); cue.textContent = "Show"; }
        }
        setScale(true, false); syncLabels(); render(true);
      });
    }

    if (widgets.play) on(widgets.play, "click", () => {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (playing) { playing = false; cancelAnimationFrame(playRAF); widgets.play.textContent = "Play"; return; }
      if (reduce) { tick = P.rounds; syncLabels(); render(false); return; }
      playing = true; widgets.play.textContent = "Pause"; tick = 1;
      const stepFn = () => {
        if (!playing) return;
        tick = Math.min(P.rounds, tick + Math.max(1, Math.round(P.rounds / 120)));
        syncLabels(); render(false);
        if (tick >= P.rounds) { playing = false; widgets.play.textContent = "Play"; return; }
        playRAF = requestAnimationFrame(stepFn);
      };
      playRAF = requestAnimationFrame(stepFn);
    });

    const histFig = figs.find(f => f.def.type === "hist");
    if (histFig) {
      on(histFig.canvas, "mousemove", e => {
        hoverX = e.clientX - histFig.canvas.getBoundingClientRect().left; render(false);
      });
      on(histFig.canvas, "mouseleave", () => { hoverX = null; render(false); });
      on(histFig.canvas, "click", e => {
        const x = e.clientX - histFig.canvas.getBoundingClientRect().left;
        const b = Figures.hist.binAtX(histFig.geom, lastHist, x);
        selBin = (b === null || b === selBin) ? null : b;
        render(false);
      });
    }

    /* The ghost is a frozen SCENARIO, not a frozen slider: it snapshots every
       parameter, so it works for changes to the coin as well as the bet. */
    function setGhost() {
      if (!simResult || !lastHist || !lastStats) return;
      ghost = {
        medLine: Float32Array.from(simResult.medLine),
        rounds: P.rounds, managers: P.managers, logScale,
        hist: { nb: lastHist.nb, dom: lastHist.dom.slice(),
                bins: Int32Array.from(lastHist.bins), max: lastHist.max },
        p: { f: P.f, pWin: P.pWin, gain: P.gain, loss: P.loss,
             managers: P.managers, rounds: P.rounds, seed: P.seed },
        mean: lastStats.mean, median: lastStats.median
      };
      render(false);
    }
    function clearGhost() { ghost = null; render(false); }
    if (widgets.ghostSet) {
      on(widgets.ghostSet, "click", setGhost);
      on(widgets.ghostClear, "click", clearGhost);
    }

    on(document, "keydown", e => {
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea") return;
      if (e.key === "Escape") { selBin = null; render(false); }
      else if (e.key === "g" && widgets.ghostSet) setGhost();
      else if (e.key === "G" && widgets.ghostSet) clearGhost();
    });

    let ro = null, rt = 0;
    if (window.ResizeObserver) {
      let d = 0;
      ro = new ResizeObserver(() => { clearTimeout(d); d = setTimeout(() => render(false), 60); });
      app.querySelectorAll(".canvasbox").forEach(n => ro.observe(n));
    }
    on(window, "resize", () => { clearTimeout(rt); rt = setTimeout(() => render(false), 100); });

    syncLabels(); render(true);

    return {
      scene, render,
      destroy() {
        playing = false; cancelAnimationFrame(playRAF); cancelAnimationFrame(raf);
        if (ro) ro.disconnect();
        off.forEach(fn => fn());
        host.innerHTML = "";
      }
    };
  }

  return { mount };
});
</script>

<script>
(function () {
  "use strict";
  const host = document.getElementById("host");
  const Q = new URLSearchParams(location.search);
  const hash = (location.hash || "").replace("#", "");
  let live = null;

  /* Every parameter is addressable, so a slide, an iframe or a link can ask
     for an exact state and a reload restores it rather than starting over.
     e.g. ?scene=p5&f=0.25   ?scene=p3&managers=2000&seed=42 */
  const NUMERIC = ["f", "pWin", "gain", "loss", "spread",
                   "managers", "rounds", "start", "seed"];

  function configFor(id) {
    const base = RLL.Scenes.byId[id] || RLL.Scenes.p5;
    const over = {};
    NUMERIC.forEach(function (k) {
      if (!Q.has(k)) return;
      const v = parseFloat(Q.get(k));
      if (isFinite(v)) over[k] = v;
    });
    if (!Object.keys(over).length) return base;
    return Object.assign({}, base, {
      params: Object.assign({}, base.params, over)
    });
  }

  function show(id) {
    if (live) live.destroy();
    live = RLL.Shell.mount(host, configFor(id));
    const bar = document.getElementById("devbar");
    if (bar) bar.querySelectorAll("[data-scene]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-scene") === id));
    });
    if (document.body.classList.contains("embed")) fitEmbed();
  }

  /* Embed mode holds the design size and scales it, so the single-screen
     layout survives being dropped into a small rectangle. */
  /* The design frame. 900 tall rather than a 16:9 810 because the control
     rail needs it — at 810 the Run group falls off the bottom. A 16:9 slide
     rectangle letterboxes slightly at the sides, which is the right trade.
     Overridable with ?w= and ?h= if a slide wants a different shape. */
  const FRAME_W = parseFloat(Q.get("w")) || 1440;
  const FRAME_H = parseFloat(Q.get("h")) || 900;
  function fitEmbed() {
    const app = document.querySelector(".app");
    if (!app) return;
    app.style.width = FRAME_W + "px";
    app.style.height = FRAME_H + "px";
    const s = Math.min(window.innerWidth / FRAME_W, window.innerHeight / FRAME_H);
    app.style.transform = "scale(" + s + ")";
  }
  if (Q.get("embed") === "1") {
    document.body.classList.add("embed");
    window.addEventListener("resize", fitEmbed);
  }

  const bar = document.getElementById("devbar");
  if (bar) ["p3", "p5"].forEach(function (id) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = id; b.setAttribute("data-scene", id);
    b.addEventListener("click", function () { location.hash = id; show(id); });
    bar.appendChild(b);
  });

  show(Q.get("scene") || hash || "p5");
})();
</script>
